<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้าง QR Code สำหรับรับชำระเงินผ่าน PromptPay</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif, "Inter", "Helvetica Neue", Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh; /* แก้ไขจาก min-height: flex เป็น 100vh แล้ว */
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      max-width: 380px;
      width: 100%;
      border: 1px solid #e5e7eb;
      box-sizing: border-box;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      color: #1f2937;
    }
    .form-group { margin-bottom: 16px; }
    .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .flex-row {
      display: flex;
      gap: 8px;
    }
    .input-text, .select-box {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      width: 100%;
    }
    .input-text:focus, .select-box:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .btn {
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn-blue { background: #2563eb; color: white; width: 100%; font-size: 16px; padding: 12px; margin-top: 8px;}
    .btn-blue:hover { background: #1d4ed8; }
    .btn-green { background: #16a34a; color: white; white-space: nowrap; }
    .btn-green:hover { background: #15803d; }
    .btn-red { background: #dc2626; color: white; }
    .btn-red:hover { background: #b91c1c; }
    .hidden { display: none !important; }
    #qrcode {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
    #qrcode canvas, #qrcode img {
      max-width: 100%;
      height: auto;
    }
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 8px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-btn {
      background: #2563eb;
      color: white;
      padding: 8px 24px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">สร้าง QR Code PromptPay</div>

    <div class="form-group">
      <label class="label">เลือกบัญชีพร้อมเพย์ที่บันทึกไว้</label>
      <div class="flex-row">
        <select id="savedTargets" class="select-box">
          <option value="">-- กรอกใหม่ / เลือกบัญชี --</option>
        </select>
        <button id="deleteTargetBtn" class="btn btn-red hidden">ลบ</button>
      </div>
    </div>

    <div class="form-group">
      <label class="label">เบอร์โทรศัพท์ หรือ เลขบัตรประชาชน</label>
      <div class="flex-row">
        <input type="text" id="target" placeholder="กรอกเฉพาะตัวเลขเท่านั้น" inputmode="numeric" pattern="[0-9]*" class="input-text" />
        <button id="saveTargetBtn" class="btn btn-green">บันทึกไว้</button>
      </div>
    </div>

    <div class="form-group">
      <label class="label">จำนวนเงิน (บาท) *ถ้ามี</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" class="input-text" />
    </div>

    <button id="generateBtn" class="btn btn-blue">สร้าง QR Code</button>

    <div id="qrcode"></div>
  </div>

  <div id="customAlertModal" class="modal-overlay hidden">
    <div class="modal-content">
      <p id="customAlertMessage" style="margin:0; color:#374151; font-size:16px;"></p>
      <button id="customAlertOkBtn" class="modal-btn">ตกลง</button>
    </div>
  </div>

  <script>
    // ส่วนจำลองหน่วยความจำกรณีโดน Android / Private Mode บล็อก localStorage
    var memoryStorage = {};
    var isLocalStorageAvailable = true;
    try {
        localStorage.setItem("test_storage", "1");
        localStorage.removeItem("test_storage");
    } catch (e) {
        isLocalStorageAvailable = false;
        console.warn("LocalStorage ถูกบล็อก! ระบบสลับไปใช้ Memory Mode แทน (รีเฟรชหน้าจะลืมข้อมูล)");
    }

    function safeGetItem(key) {
        return isLocalStorageAvailable ? localStorage.getItem(key) : memoryStorage[key];
    }
    function safeSetItem(key, value) {
        if (isLocalStorageAvailable) {
            localStorage.setItem(key, value);
        } else {
            memoryStorage[key] = value;
        }
    }

    var generatePayload = function (id, amount) {
        function formatLength(len) { return len.toString().padStart(2, '0'); }
        var payloadParts = [];
        payloadParts.push('00' + formatLength(2) + '01');
        payloadParts.push('01' + formatLength(2) + '11');

        var promptPayGUID = 'A000000677010111'; 
        var guidSubTagContent = '00' + '16' + promptPayGUID; 

        var idFieldContent = '';
        if (id.length === 10) { 
            var mobileNumberConverted = '00' + '66' + id.substring(1); 
            idFieldContent = '01' + formatLength(mobileNumberConverted.length) + mobileNumberConverted; 
        } else if (id.length === 13) { 
            idFieldContent = '02' + formatLength(id.length) + id; 
        } else {
            throw new Error("กรุณากรอกเลขให้ครบ 10 หรือ 13 หลัก");
        }

        var merchantAccountInfoValue = guidSubTagContent + idFieldContent;
        var merchantAccountInfoLength = id.length === 10 ? 37 : merchantAccountInfoValue.length;

        var merchantAccountInfoTag = '29' + formatLength(merchantAccountInfoLength) + merchantAccountInfoValue;
        payloadParts.push(merchantAccountInfoTag);

        payloadParts.push('52' + formatLength(4) + '0000');
        payloadParts.push('53' + formatLength(3) + '764');

        if (amount && parseFloat(amount) > 0) {
            var amountString = parseFloat(amount).toFixed(2);
            payloadParts.push('54' + formatLength(amountString.length) + amountString);
        }

        payloadParts.push('58' + formatLength(2) + 'TH');
        payloadParts.push('59' + formatLength(0) + ''); 
        payloadParts.push('60' + formatLength(0) + ''); 
        payloadParts.push('61' + formatLength(0) + ''); 

        var dataStringForCRC = payloadParts.join('');
        var crcInputString = dataStringForCRC + '6304';
        var crc = getCRC(crcInputString); 

        return dataStringForCRC + '6304' + crc;
    };

    var getCRC = function (data) {
        var crc = 0xFFFF;
        var polynomial = 0x1021;
        for (var i = 0; i < data.length; i++) {
            var charCode = data.charCodeAt(i);
            for (var j = 0; j < 8; j++) {
                var bit = (charCode >> (7 - j)) & 1;
                var c15 = (crc >> 15) & 1;
                crc <<= 1;
                if (c15 ^ bit) crc ^= polynomial;
            }
        }
        crc &= 0xFFFF; 
        return ('0000' + crc.toString(16).toUpperCase()).slice(-4); 
    };

    document.addEventListener("DOMContentLoaded", () => {
      const customAlertModal = document.getElementById("customAlertModal");
      const customAlertMessage = document.getElementById("customAlertMessage");
      const customAlertOkBtn = document.getElementById("customAlertOkBtn");

      function showAlert(message) {
        customAlertMessage.textContent = message;
        customAlertModal.classList.remove("hidden");
      }

      customAlertOkBtn.addEventListener("click", () => {
        customAlertModal.classList.add("hidden");
      });

      const generateBtn = document.getElementById("generateBtn");
      const targetInput = document.getElementById("target");
      const amountInput = document.getElementById("amount");
      const qrContainer = document.getElementById("qrcode");
      const savedTargetsSelect = document.getElementById("savedTargets");
      const saveTargetBtn = document.getElementById("saveTargetBtn");
      const deleteTargetBtn = document.getElementById("deleteTargetBtn");

      // บังคับกรอกได้เฉพาะตัวเลขเท่านั้น
      targetInput.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
      });

      function getSavedTargets() {
        const data = safeGetItem("pp_local_targets");
        return data ? JSON.parse(data) : [];
      }

      function updateSelectOptions() {
        const targets = getSavedTargets();
        console.log("ข้อมูลในคลังปัจจุบัน:", targets); // Debug ข้อมูลคลังเก็บเลขตามคำแนะนำของคุณ
        
        savedTargetsSelect.innerHTML = '<option value="">-- กรอกใหม่ / เลือกบัญชี --</option>';
        
        targets.forEach(item => {
          const option = document.createElement("option");
          option.value = item;
          const type = item.length === 10 ? "เบอร์โทร" : "เลข ปชช.";
          option.textContent = `${type}: ${item}`;
          savedTargetsSelect.appendChild(option);
        });

        if (savedTargetsSelect.value) {
          deleteTargetBtn.classList.remove("hidden");
        } else {
          deleteTargetBtn.classList.add("hidden");
        }
      }

      // ปุ่มบันทึกหมายเลข
      saveTargetBtn.addEventListener("click", () => {
        const val = targetInput.value.trim();
        if (val.length !== 10 && val.length !== 13) {
          showAlert("กรุณากรอกเบอร์โทร 10 หลัก หรือเลขบัตรประชาชน 13 หลักให้ถูกต้องก่อนบันทึก");
          return;
        }

        let targets = getSavedTargets();
        if (targets.includes(val)) {
          showAlert("หมายเลขนี้ถูกบันทึกอยู่แล้ว");
          return;
        }

        targets.push(val);
        safeSetItem("pp_local_targets", JSON.stringify(targets));
        updateSelectOptions();
        savedTargetsSelect.value = val;
        deleteTargetBtn.classList.remove("hidden");
        
        let successMsg = "บันทึกหมายเลขเรียบร้อย";
        if (!isLocalStorageAvailable) successMsg += " (แจ้งเตือน: บราวเซอร์นี้บล็อกความจำถาวร ข้อมูลจะหายเมื่อปิดแอป)";
        showAlert(successMsg);
      });

      // ปุ่มลบข้อมูล
      deleteTargetBtn.addEventListener("click", () => {
        const selectedVal = savedTargetsSelect.value;
        if (!selectedVal) return;

        let targets = getSavedTargets();
        targets = targets.filter(item => item !== selectedVal);
        safeSetItem("pp_local_targets", JSON.stringify(targets));
        
        targetInput.value = "";
        updateSelectOptions();
        showAlert("ลบหมายเลขเรียบร้อยแล้ว");
      });

      savedTargetsSelect.addEventListener("change", (e) => {
        const val = e.target.value;
        targetInput.value = val; 
        if (val) {
          deleteTargetBtn.classList.remove("hidden");
        } else {
          deleteTargetBtn.classList.add("hidden");
        }
      });

      // เรียกแสดงรายชื่อเมื่อโหลดหน้าเว็บ
      updateSelectOptions();

      // เมื่อกดสร้าง QR Code (แก้ไขโครงสร้างตรงตามมาตรฐานและพิมพ์ค่า Payload ลง Console)
      generateBtn.addEventListener("click", () => {
        const numericInput = targetInput.value.trim();
        qrContainer.innerHTML = ""; 

        if (!/^(0\d{9}|\d{13})$/.test(numericInput)) {
          showAlert("กรุณากรอกเบอร์โทร 10 หลัก หรือเลขบัตรประชาชน 13 หลักให้ถูกต้อง");
          return;
        }

        const amountValue = amountInput.value.trim();
        const amount = parseFloat(amountValue);

        try {
          const payload = generatePayload(numericInput, !isNaN(amount) && amount > 0 ? amount : undefined);
          
          console.log("--- DEBUG QR CODE ---");
          console.log("Payload:", payload);
          console.log("QRCode Instance Available:", typeof QRCode !== "undefined");

          // ล้างห้องแสดงผลเดิม
          qrContainer.innerHTML = "";

          // เรียกใช้ฟังก์ชันผ่าน โครงสร้าง Object มาตรฐานที่คุณแนะนำ แก้ปัญหา d is not a function เรียบร้อยครับ
          new QRCode("qrcode", {
              text: payload,
              width: 230,
              height: 230,
              colorDark: "#000000",
              colorLight: "#ffffff"
          }).make();

        } catch (err) {
          showAlert("เกิดข้อผิดพลาด: " + err.message);
        }
      });
    });
  </script>
